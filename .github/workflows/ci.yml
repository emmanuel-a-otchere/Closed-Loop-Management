name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (api + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check api/ tests/
      - name: Type-check (mypy)
        run: mypy api/
      - name: Test (pytest)
        run: pytest --cov=clam --cov-report=term-missing

  oas-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install openapi-spec-validator
      - name: Generate OAS + validate (OAS 3.1)
        run: |
          python scripts/export_openapi.py --out openapi/openapi.json
          python -m openapi_spec_validator openapi/openapi.json --schema 3.1
      - name: Snapshot check
        run: |
          git diff --quiet openapi/openapi.json || (echo "::warning::OpenAPI snapshot drifted from generated OAS. Run scripts/export_openapi.py locally and commit."; exit 0)

  cardinal-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: D-004 (no em-dash U+2014, en-dash U+2013, triple-punctator U+2E3B)
        run: |
          ! grep -rln $'\xe2\x80\x94' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.toml' --include='*.py' . || (echo "D-004 violation: em-dash U+2014 found"; exit 1)
          ! grep -rln $'\xe2\x80\x93' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.toml' --include='*.py' . || (echo "D-004 violation: en-dash U+2013 found"; exit 1)
      - name: D-005 (no triple-semicolon in prose)
        run: |
          ! grep -rn ';;;' --include='*.md' . || (echo "D-005 violation: triple-semicolon in prose"; exit 1)
      - name: Cardinal author rule (commit author == emmanuel-a-otchere)
        run: |
          git log -1 --format='%an <%ae>' | grep -q 'emmanuel-a-otchere' || (echo "Last commit author is not the cardinal author"; exit 1)