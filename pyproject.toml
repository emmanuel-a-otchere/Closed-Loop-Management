[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clam"
version = "0.2.0"
description = "Closed Loop Automation Management -- REST API, OAS 3.1 data model, and supporting toolkits"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Emmanuel A. Otchere", email = "111851430+emmanuel-a-otchere@users.noreply.github.com" },
]
keywords = ["closed-loop", "automation", "ooda", "mape", "rest", "openapi", "toolkit"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "openapi-spec-validator>=0.7",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.7",
]
toolkit-oas-validator = [
    "openapi-spec-validator>=0.7",
]
toolkit-loop-simulator = [
    "httpx>=0.27",
    "rich>=13.7",
]
toolkit-erd-to-oas = [
    "openpyxl>=3.1",
]
toolkit-kpi-calculator = [
    "pydantic>=2.9",
    "rich>=13.7",
]
toolkit-goalsim = [
    "rich>=13.7",
]

[project.scripts]
machines-service = "machines.service.clam.cli:main"
clam-oas-validator = "machines.toolkits.oas_validator.cli:main"
clam-loop-simulator = "machines.toolkits.loop_simulator.cli:main"
clam-erd-to-oas = "machines.toolkits.erd_to_oas.cli:main"
clam-maturity-assessment = "machines.toolkits.maturity_assessment.cli:main"
clam-kpi-calculator = "machines.toolkits.kpi_calculator.cli:main"
clam-goalsim = "machines.toolkits.goalsim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["machines"]
exclude = [
    "tests",
    "docs",
    "datasets",
    ".github",
    "schemas",
    "machines/scripts/seed_db.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"machines/service/clam/routers/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"