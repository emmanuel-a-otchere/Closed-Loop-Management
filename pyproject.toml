[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clam"
version = "0.1.0"
description = "Closed Loop Automation Management REST API + OAS 3.1 data model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Emmanuel A. Otchere", email = "111851430+emmanuel-a-otchere@users.noreply.github.com" },
]
keywords = ["closed-loop", "automation", "ooda", "mape", "rest", "openapi"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
clam = "clam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["api/clam"]
exclude = ["tests", "docs", "examples", ".github"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "N803"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"api/clam/routers/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"